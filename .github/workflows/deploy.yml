name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions for the Pages deployment. Nothing here needs write access to
# the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are allowed to finish so a half-uploaded
# artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the GitHub Pages base path
        id: base
        # A project site is served from https://<owner>.github.io/<repo>/, so the app needs
        # basePath="/<repo>". A user or organization site (<owner>.github.io) is served from
        # the domain root and must have no base path. The repository name comes from the
        # event, so nothing here hardcodes an owner or a repo.
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Optional: set a repository variable of the same name to point the deployed app
          # at a different Technocore instance (for example your own, with CORS enabled for
          # your Pages origin). Empty falls back to https://technocore.chat.
          NEXT_PUBLIC_TECHNOCORE_BASE_URL: ${{ vars.TECHNOCORE_BASE_URL }}
        run: npm run build

      - name: Disable Jekyll processing
        # GitHub Pages' Jekyll pipeline drops directories beginning with an underscore,
        # which would take Next.js's entire /_next/ bundle with it.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
